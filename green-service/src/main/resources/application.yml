server:
  port: 8082

spring:
  application:
    name: green-service
  datasource:
    url: jdbc:mysql://localhost:3308/catalog_v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/v2-changelog.xml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    com.hirono.green: DEBUG
    liquibase: INFO