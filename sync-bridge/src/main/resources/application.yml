server:
  port: 8083

spring:
  application:
    name: sync-bridge

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

bridge:
  blue:
    url: jdbc:mysql://localhost:3307/catalog_v1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  green:
    url: jdbc:mysql://localhost:3308/catalog_v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    com.hirono.bridge: DEBUG