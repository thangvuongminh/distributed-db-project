apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-service
  namespace: distdb
  labels:
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blue-service
  template:
    metadata:
      labels:
        app: blue-service
        version: blue
    spec:
      containers:
        - name: blue-service
          image: blue-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-blue.distdb:3306/catalog_v1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
---
apiVersion: v1
kind: Service
metadata:
  name: blue-service
  namespace: distdb
spec:
  selector:
    app: blue-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
  type: NodePort