apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-green
  namespace: distdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-green
  template:
    metadata:
      labels:
        app: mysql-green
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: catalog_v2
            - name: MYSQL_USER
              value: app
            - name: MYSQL_PASSWORD
              value: app123
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-green
  namespace: distdb
spec:
  selector:
    app: mysql-green
  ports:
    - port: 3306
      targetPort: 3306